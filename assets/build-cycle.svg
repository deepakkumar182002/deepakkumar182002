<svg xmlns="http://www.w3.org/2000/svg" width="840" height="370" viewBox="0 0 840 370" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <path id="orbit" d="M420 60 A290 140 0 0 1 420 340 A290 140 0 0 1 420 60" />
  </defs>

  <!-- Flowing orbit -->
  <use href="#orbit" fill="none" stroke="#36BCF7" stroke-opacity="0.18" stroke-width="2" />
  <use href="#orbit" fill="none" stroke="#36BCF7" stroke-width="2" stroke-dasharray="6 10" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite" />
  </use>

  <!-- Direction arrows (pulse in sequence) -->
  <g fill="none" stroke="#36BCF7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-7 -8 L4 0 L-7 8" transform="translate(590.5 86.7) rotate(19.3)" opacity="0.35">
      <animate attributeName="opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.08;0.2;1" dur="5s" begin="0.5s" repeatCount="indefinite" />
    </path>
    <path d="M-7 -8 L4 0 L-7 8" transform="translate(695.8 243.3) rotate(124)" opacity="0.35">
      <animate attributeName="opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.08;0.2;1" dur="5s" begin="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M-7 -8 L4 0 L-7 8" transform="translate(420 340) rotate(180)" opacity="0.35">
      <animate attributeName="opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.08;0.2;1" dur="5s" begin="2.5s" repeatCount="indefinite" />
    </path>
    <path d="M-7 -8 L4 0 L-7 8" transform="translate(144.2 243.3) rotate(236)" opacity="0.35">
      <animate attributeName="opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.08;0.2;1" dur="5s" begin="3.5s" repeatCount="indefinite" />
    </path>
    <path d="M-7 -8 L4 0 L-7 8" transform="translate(249.5 86.7) rotate(-19.3)" opacity="0.35">
      <animate attributeName="opacity" values="0.35;1;0.35;0.35" keyTimes="0;0.08;0.2;1" dur="5s" begin="4.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Centre label -->
  <text x="420" y="194" text-anchor="middle" fill="#36BCF7" font-size="13" font-weight="700" letter-spacing="3">PRODUCT CYCLE</text>
  <text x="420" y="216" text-anchor="middle" fill="#8b949e" font-size="13">Idea → Production → Iterate</text>

  <!-- Step nodes -->
  <g id="n0">
    <rect x="325" y="28" width="190" height="64" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <rect x="325" y="28" width="190" height="64" rx="12" fill="none" stroke="#36BCF7" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.2;1" dur="5s" begin="0s" repeatCount="indefinite" />
    </rect>
    <circle cx="325" cy="28" r="13" fill="#36BCF7" />
    <text x="325" y="32" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="700">01</text>
    <text x="420" y="57" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Architecture</text>
    <text x="420" y="77" text-anchor="middle" fill="#8b949e" font-size="12">System design · DB schema</text>
  </g>

  <g id="n1">
    <rect x="601" y="125" width="190" height="64" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <rect x="601" y="125" width="190" height="64" rx="12" fill="none" stroke="#36BCF7" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.2;1" dur="5s" begin="1s" repeatCount="indefinite" />
    </rect>
    <circle cx="601" cy="125" r="13" fill="#36BCF7" />
    <text x="601" y="129" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="700">02</text>
    <text x="696" y="154" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Smart Contracts</text>
    <text x="696" y="174" text-anchor="middle" fill="#8b949e" font-size="12">Solidity · EVM · Foundry</text>
  </g>

  <g id="n2">
    <rect x="495" y="281" width="190" height="64" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <rect x="495" y="281" width="190" height="64" rx="12" fill="none" stroke="#36BCF7" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.2;1" dur="5s" begin="2s" repeatCount="indefinite" />
    </rect>
    <circle cx="495" cy="281" r="13" fill="#36BCF7" />
    <text x="495" y="285" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="700">03</text>
    <text x="590" y="310" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Backend &amp; APIs</text>
    <text x="590" y="330" text-anchor="middle" fill="#8b949e" font-size="12">Node.js · Auth · Payments</text>
  </g>

  <g id="n3">
    <rect x="155" y="281" width="190" height="64" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <rect x="155" y="281" width="190" height="64" rx="12" fill="none" stroke="#36BCF7" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.2;1" dur="5s" begin="3s" repeatCount="indefinite" />
    </rect>
    <circle cx="155" cy="281" r="13" fill="#36BCF7" />
    <text x="155" y="285" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="700">04</text>
    <text x="250" y="310" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Frontend</text>
    <text x="250" y="330" text-anchor="middle" fill="#8b949e" font-size="12">React · Dashboards · Web3 UI</text>
  </g>

  <g id="n4">
    <rect x="49" y="125" width="190" height="64" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <rect x="49" y="125" width="190" height="64" rx="12" fill="none" stroke="#36BCF7" stroke-width="2" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.16;0.2;1" dur="5s" begin="4s" repeatCount="indefinite" />
    </rect>
    <circle cx="49" cy="125" r="13" fill="#36BCF7" />
    <text x="49" y="129" text-anchor="middle" fill="#0d1117" font-size="11" font-weight="700">05</text>
    <text x="144" y="154" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Deploy &amp; Scale</text>
    <text x="144" y="174" text-anchor="middle" fill="#8b949e" font-size="12">Docker · Nginx · CI/CD · AWS</text>
  </g>
</svg>
